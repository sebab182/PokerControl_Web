                    type: string
                  message:
                    type: string
    post:
      tags:
        - groups
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              type: object
              required:
                - name
              properties:
                name:
                  minLength: 1
                  maxLength: 120
                  type: string
                timezone:
                  minLength: 1
                  maxLength: 64
                  type: string
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                additionalProperties: false
                title: Group
                type: object
                required:
                  - id
                  - name
                  - inviteCode
                  - timezone
                  - createdAt
                  - isMember
                  - members
                properties:
