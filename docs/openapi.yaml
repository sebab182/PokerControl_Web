openapi: 3.0.3
info:
  title: PokerControl API
  version: 1.0.0
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas: {}
paths:
  /health:
    get:
      security: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                additionalProperties: false
                title: Ok
                type: object
                required:
                  - ok
                properties:
                  ok:
                    type: boolean
  /api/v1/auth/google:
    post:
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              type: object
              required:
                - idToken
              properties:
                idToken:
                  minLength: 1
                  type: string
      security: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                additionalProperties: false
                title: AuthResponse
                type: object
                required:
                  - token
                  - user
                  - groups
                properties:
                  token:
                    type: string
                  user:
                    additionalProperties: false
                    title: User
                    type: object
                    required:
                      - id
                      - name
                      - email
                      - pictureUrl
                      - role
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      email:
                        type: string
                      pictureUrl:
                        type: string
                        nullable: true
                      role:
                        anyOf:
                          - type: string
                            enum:
                              - master
                          - type: string
                            enum:
                              - admin
                          - type: string
                            enum:
                              - reader
                  groups:
                    type: array
                    items:
                      additionalProperties: false
                      title: GroupRef
                      type: object
                      required:
                        - id
                        - name
                        - playerId
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        playerId:
                          type: string
                          nullable: true
        4XX:
          description: Default Response
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Error
                type: object
                required:
                  - error
                  - message
                properties:
                  error:
                    type: string
                  message:
                    type: string
