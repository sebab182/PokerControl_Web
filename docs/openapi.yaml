                    type: string
                  name:
                    type: string
                  inviteCode:
                    type: string
                    nullable: true
                  timezone:
                    type: string
                  createdAt:
                    type: string
                  isMember:
                    type: boolean
                  members:
                    type: array
                    items:
                      additionalProperties: false
                      title: GroupMember
                      type: object
                      required:
                        - id
                        - name
                        - joinedAt
                        - playerId
                      properties:
                        id:
                          type: string
                        name:
