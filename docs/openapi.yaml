  /api/v1/groups/{groupId}/table:
    get:
      tags: &a2
        - table
      parameters:
        - schema:
            type: string
          in: path
          name: groupId
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                additionalProperties: false
                title: TableView
                type: object
                required:
                  - id
                  - status
                  - sessionId
                  - smallBlind
                  - bigBlind
                  - buyIn
                  - version
                  - seats
                  - myPlayerId
                  - hand
                properties:
                  id:
                    type: string
                  status:
                    anyOf:
                      - type: string
                        enum:
                          - waiting
                      - type: string
                        enum:
                          - playing
                  sessionId:
                    type: string
                    nullable: true
                  smallBlind:
                    type: integer
                  bigBlind:
                    type: integer
                  buyIn:
                    type: integer
                  version:
                    type: integer
                  seats:
                    type: array
                    items:
                      additionalProperties: false
                      title: TableSeat
                      type: object
                      required:
                        - playerId
                        - name
                        - stack
                        - status
                        - online
                        - isYou
                      properties:
                        playerId:
                          type: string
                        name:
                          type: string
                        stack:
                          type: integer
                        status:
                          anyOf:
                            - type: string
                              enum:
                                - sitting
                            - type: string
                              enum:
                                - out
                        online:
                          type: boolean
                        isYou:
                          type: boolean
                  myPlayerId:
                    type: string
                    nullable: true
                  hand:
                    additionalProperties: false
                    title: HandView
                    type: object
                    required:
                      - handNo
                      - street
                      - board
                      - pot
                      - currentBet
                      - minRaise
                      - button
                      - toActPlayerId
                      - players
                      - legal
                      - payouts
                      - showdown
                    properties:
                      handNo:
                        type: integer
                      street:
                        anyOf:
                          - type: string
                            enum:
                              - preflop
                          - type: string
                            enum:
                              - flop
                          - type: string
                            enum:
                              - turn
                          - type: string
                            enum:
                              - river
                          - type: string
                            enum:
                              - done
                      board:
                        type: array
                        items:
                          type: string
                      pot:
                        type: integer
                      currentBet:
                        type: integer
                      minRaise:
                        type: integer
                      button:
                        type: integer
                      toActPlayerId:
                        type: string
                        nullable: true
                      players:
                        type: array
                        items:
                          additionalProperties: false
                          title: HandPlayerView
                          type: object
                          required:
                            - playerId
                            - stack
                            - bet
                            - totalBet
                            - folded
                            - allIn
                            - hole
                          properties:
                            playerId:
                              type: string
                            stack:
                              type: integer
                            bet:
                              type: integer
                            totalBet:
                              type: integer
                            folded:
                              type: boolean
                            allIn:
                              type: boolean
                            hole:
                              type: array
                              items:
                                type: string
                      legal:
                        additionalProperties: false
                        title: LegalActions
                        type: object
                        required:
                          - toCall
                          - canCheck
                          - canCall
                          - callAmount
                          - canRaise
                          - minRaiseTo
                          - maxRaiseTo
                        properties:
                          toCall:
                            type: integer
                          canCheck:
                            type: boolean
                          canCall:
                            type: boolean
                          callAmount:
                            type: integer
                          canRaise:
                            type: boolean
                          minRaiseTo:
                            type: integer
                          maxRaiseTo:
                            type: integer
                        nullable: true
                      payouts:
                        type: array
                        items:
                          additionalProperties: false
                          type: object
                          required:
                            - playerId
                            - amount
                          properties:
                            playerId:
                              type: string
                            amount:
                              type: integer
                      showdown:
                        type: array
                        items:
                          additionalProperties: false
                          type: object
                          required:
                            - playerId
                            - hole
                            - handName
                          properties:
                            playerId:
                              type: string
                            hole:
                              type: array
                              items:
                                type: string
                            handName:
                              type: string
                    nullable: true
        4XX:
          description: Default Response
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Error
                type: object
                required:
                  - error
                  - message
                properties:
                  error:
                    type: string
                  message:
                    type: string
