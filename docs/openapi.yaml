          application/json:
            schema:
              additionalProperties: false
              type: object
              properties:
                playerId:
                  type: string
                name:
                  minLength: 1
                  maxLength: 120
                  type: string
      parameters:
        - schema:
            type: string
          in: path
          name: groupId
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                additionalProperties: false
                title: Player
                type: object
                required:
                  - id
                  - name
                  - createdAt
                  - archivedAt
                  - linked
                  - adjustments
