name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_DATABASE_URL: postgresql://pokercontrol:ci-solo-local@localhost:5432/pokercontrol_test
      TMPDIR: ${{ github.workspace }}/.tmp
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pokercontrol
          POSTGRES_PASSWORD: ci-solo-local
          POSTGRES_DB: pokercontrol_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pokercontrol"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Buscar secretos en el repo
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: mkdir -p "$TMPDIR"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm --filter @pokercontrol/web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - name: Guardar el reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright
          path: .tmp/pokercontrol/pw-*
          retention-days: 7
